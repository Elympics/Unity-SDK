variables:
  NODE_VERSION: "18.13.0"
  DOTNET_VERSION: "8.0"
  DOTNET_ROOT: /usr/share/dotnet
  MESSAGEPACK_VERSION: "2.5.124"
  PROTOC_VERSION: "34.1"
  UNITY_ACTIVATION_FILE: ./unity3d.alf
  YQ_VERSION: "v4.54.1"
  YQ_SHA256: "8e34fc298390875de416e6a4afcb8cabeceb25d9aa8506c1a2f9353cf702ea5f"
  UNITY_VERSION: 6000.3.10f1
  # For the :newest jobs.
  NEWEST_UNITY_VERSION: 6000.6.4f1
  UNITY_ARCH: base-3
  TESTING_PROJECT_NAME: TestingProject
  UNITY_DIR: ${CI_PROJECT_DIR}/${TESTING_PROJECT_NAME}
  PACKAGE_DIR: ${UNITY_DIR}/Packages/com.daftmobile.elympics
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  FF_ENABLE_BASH_EXIT_CODE_CHECK: 1
  ASSEMBLY_INFO_FILES: |-
    Runtime/AssemblyInfo.cs
    Editor/AssemblyInfo.cs
    Editor/Weaving/AssemblyInfo.cs
    Tests/Runtime/AssemblyInfo.cs
  COVERAGE_ASSEMBLY_FILTERS: |-
    +Elympics
    +Elympics.*
    +Elympics.Editor.*
    -Elympics.Tests
    -Elympics.Tests.*
    -Elympics.Editor.Tests
    -Elympics.Editor.Tests.*
  COVERAGE_PATH_FILTERS: |-
    -**/Runtime/Plugins/**
    -**/GameEngine/Libraries/**
  RELEASE_ONLY:
    value: "false"
    options: ["false", "true"]
    description: "true skips build, test and verify jobs (release jobs only)"

stages:
  - prepare-version
  - prepare-license
  - compile
  - build
  - test
  - verify
  - pre-release
  - release

default:
  cache: {}
  tags:
    - docker

workflow:
  rules:
    # Coverage is tracked on develop only; elsewhere the tests run uninstrumented, which is faster.
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        CODE_COVERAGE: "true"
    - if: "$CI_COMMIT_BRANCH"
    - if: "$CI_COMMIT_TAG"
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never

# Build, test and verify jobs run only when code changed. detect_tested_release_merge.sh reads this list too.
.code_paths: &code_paths
  - Runtime/**/*
  - Editor/**/*
  - Tests/**/*
  - Samples~/**/*
  - "*.dll"
  - package.json
  - jsconfig.json
  - .editorconfig
  - .gitlab-ci.yml
  - .scripts/**/*

.cond.code:
  rules:
    - if: "$CI_COMMIT_TAG"
      when: never
    - if: '$RELEASE_ONLY == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web"'
    # A new release branch repeats develop's pipeline unless it differs from develop.
    - if: '$CI_COMMIT_BRANCH =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      changes:
        paths: *code_paths
        compare_to: refs/heads/develop
    - if: '$CI_COMMIT_BRANCH =~ /^release\/v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_COMMIT_BEFORE_SHA == "0000000000000000000000000000000000000000"'
      when: never
    # Feature branches compare with develop, so a docs-only push after a failed code push still runs the tests.
    - if: '$CI_COMMIT_BRANCH !~ /^(develop|main|(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+)$/'
      changes:
        paths: *code_paths
        compare_to: refs/heads/develop
    - if: '$CI_COMMIT_BRANCH !~ /^(develop|main|(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+)$/'
      when: never
    - changes: *code_paths

.cond.code.license:
  rules:
    - if: "$UNITY_LICENSE == null"
      when: never
    - !reference [.cond.code, rules]

.skip_if_tested:
  before_script: &skip_if_tested
    - 'if [ "$SKIP_CODE_JOBS" = 1 ]; then echo "Skipped: develop already tested this code"; exit 0; fi'

.cond.releasebranch:
  rules: &cond_releasebranch_rules
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: always

.cond.release.auto:
  rules: &cond_release_auto_rules
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always

.cond.release.post:
  rules: &cond_release_post_rules
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: always

.cond.release.always:
  rules: &cond_release_always_rules
    - *cond_release_auto_rules
    - *cond_release_post_rules

.cond.release.orbranch:
  rules:
    - *cond_releasebranch_rules
    - *cond_release_always_rules

.cond.release.manual:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual

.alpine_image:
  image: alpine:latest

.unity_image:
  image: unityci/editor:ubuntu-$UNITY_VERSION-$UNITY_ARCH
  # Retry once on a Unity crash (exit 134/139) or a timeout.
  retry:
    max: 1
    when:
      - job_execution_timeout
    exit_codes:
      - 134
      - 139

# For jobs that create their own testing project. The cache isn't shared between runners, so a miss means a reimport.
# A change to create_testing_project.sh starts a new cache, since a cached project skips the script's Unity runs.
.library_cache:
  cache:
    key:
      files:
        - .scripts/ci/create_testing_project.sh
      prefix: library-$UNITY_VERSION
    paths:
      - "$TESTING_PROJECT_NAME/Library/"
      - "$TESTING_PROJECT_NAME/ProjectSettings/"
    policy: pull-push

.dotnet_image:
  image: mcr.microsoft.com/dotnet/sdk:$DOTNET_VERSION

.node_image:
  image: node:$NODE_VERSION

.bash_image:
  image: bash

.ubuntu_image:
  image: ubuntu

.unity_default:
  before_script: &unity_default_before_script
    - ./.scripts/ci/before_script.sh

.unity_code:
  before_script: &unity_code_before_script
    - *skip_if_tested
    - *unity_default_before_script

.install_yq:
  script: &install_yq
    - wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
      && echo "${YQ_SHA256}  /usr/local/bin/yq" | sha256sum -c -
      && chmod +x /usr/local/bin/yq

.install_dotnet:
  script: &install_dotnet
    # The Unity 6 image is Ubuntu 22.04; Microsoft's install script avoids mixing its apt repo with Ubuntu's .NET packages.
    - wget -q https://dot.net/v1/dotnet-install.sh -O /tmp/dotnet-install.sh && bash /tmp/dotnet-install.sh --channel $DOTNET_VERSION --install-dir "$DOTNET_ROOT"
    - ln -sf "$DOTNET_ROOT/dotnet" /usr/local/bin/dotnet
    # .NET needs ICU; invariant globalization would change mpc's culture-sorted output.
    - apt-get update && apt-get install -y --no-install-recommends libicu-dev

get-package-version:
  extends:
    - .bash_image
    - .cond.release.orbranch
  stage: prepare-version
  variables:
    GIT_DEPTH: 1
  before_script:
    - apk add --no-cache jq
  script:
    - export PACKAGE_VERSION=$(./.scripts/ci/semver_from_package.sh package.json)
    - echo PACKAGE_VERSION=$PACKAGE_VERSION | tee prepare.env
    - echo RELEASE_TAG_VERSION="v$PACKAGE_VERSION" | tee -a prepare.env
    - cat prepare.env
  artifacts:
    reports:
      dotenv: prepare.env

get-branch-version:
  extends:
    - .bash_image
    - .cond.releasebranch
  stage: prepare-version
  variables:
    GIT_DEPTH: 1
  script:
    - echo BRANCH_VERSION=$(./.scripts/ci/semver_from_branch.sh $CI_COMMIT_BRANCH) | tee prepare.env
  artifacts:
    reports:
      dotenv: prepare.env

get-activation-file:
  extends:
    - .unity_image
  rules:
    - if: "$UNITY_LICENSE == null"
      when: manual
  stage: prepare-license
  variables:
    GIT_DEPTH: 1
  before_script:
    - *unity_default_before_script
  script:
    - ./.scripts/ci/get_activation_file.sh
  artifacts:
    paths:
      - $UNITY_ACTIVATION_FILE
    expire_in: 10 min

detect-tested-release-merge:
  extends:
    - .alpine_image
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $RELEASE_ONLY != "true" && $CI_PIPELINE_SOURCE != "web"'
  stage: prepare-version
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git curl jq
    - *install_yq
  script:
    - ./.scripts/ci/detect_tested_release_merge.sh skip.env
  artifacts:
    reports:
      dotenv: skip.env

check-commits:
  extends:
    - .alpine_image
  stage: verify
  needs: []
  variables:
    GIT_DEPTH: 0
  before_script:
   - apk add git
  script:
    - ./.scripts/ci/check_for_tmp_commits.sh

verify-js:
  extends:
    - .node_image
    - .cond.code
    - .skip_if_tested
  stage: verify
  needs:
    - job: detect-tested-release-merge
      optional: true
  variables:
    GIT_DEPTH: 1
    NODE_VERSION: "20"
  script:
    - ./.scripts/ci/check_js.sh

create-testing-project:
  extends:
    - .unity_image
    - .library_cache
    - .cond.code.license
  stage: compile
  needs:
    - job: detect-tested-release-merge
      optional: true
  timeout: 30m
  variables:
    GIT_DEPTH: 1
  before_script:
    - *unity_code_before_script
    - *install_yq
  script:
    - ./.scripts/ci/create_testing_project.sh
  artifacts:
    paths:
      - "./$TESTING_PROJECT_NAME"
    # Library/ in full is too large for an artifact. Without PackageManager/, Unity resolves and downloads the packages again.
    exclude:
      - "./$TESTING_PROJECT_NAME/Library/PackageCache/**/*"
      - "./$TESTING_PROJECT_NAME/Library/PackageManager/**/*"
      - "./$TESTING_PROJECT_NAME/Library/BurstCache/**/*"
    expire_in: 1 hour

create-testing-project:newest:
  extends: create-testing-project
  variables:
    UNITY_VERSION: $NEWEST_UNITY_VERSION

compile:elympics-debug:
  extends:
    - .unity_image
    - .cond.code.license
  stage: build
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  # A separate job, so a Unity crash on quit here doesn't hold up the tests.
  timeout: 30m
  variables:
    GIT_DEPTH: 1
  before_script:
    - *unity_code_before_script
    - *install_yq
  script:
    - ./.scripts/ci/run_with_defines.sh "ELYMPICS_DEBUG;ELYMPICS_LAZY_WEBRTC_CONTEXT"

build:sample:
  extends:
    - .unity_image
    - .cond.code.license
  timeout: 45m
  image: unityci/editor:ubuntu-$UNITY_VERSION-$BUILD_UNITY_ARCH
  stage: build
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
    CI_BUILD_SCENES: "Assets/Samples/ButtonClicker/ButtonClicker.unity"
  parallel:
    matrix:
      - BUILD_TARGET: StandaloneLinux64
        BUILD_UNITY_ARCH: base-3
      - BUILD_TARGET: WebGL
        BUILD_UNITY_ARCH: webgl-3
  before_script:
    - *unity_code_before_script
  script:
    - ./.scripts/ci/build_sample.sh

build:sample:newest:
  extends: build:sample
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project:newest
  variables:
    UNITY_VERSION: $NEWEST_UNITY_VERSION

.test:
  extends:
    - .unity_image
    - .cond.code.license
  stage: test
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  before_script:
    - *unity_code_before_script
    - apt-get update && apt-get install -y --no-install-recommends jq xsltproc
  script:
    - ./.scripts/ci/test.sh
  artifacts:
    when: always
    paths:
      - "$TEST_PLATFORM-results.xml"
      - coverage/
    expire_in: 2 weeks
    reports:
      junit: "$TEST_PLATFORM-results.xml"

test:playmode:
  extends: .test
  variables:
    TEST_PLATFORM: playmode
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1

test:playmode:no-domain-reload:
  extends: .test
  variables:
    TEST_PLATFORM: playmode
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1
    # Coverage comes from test:playmode; without instrumentation, garbage-collection tests (RaiseAfterGC) really run here.
    CODE_COVERAGE: "false"
  script:
    - ./.scripts/ci/disable_domain_reload.sh
    - ./.scripts/ci/test.sh

test:editmode:
  extends: .test
  variables:
    TEST_PLATFORM: editmode
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1

test:disable-defines:
  extends: .test
  # The SDK's opt-out defines compile out code paths, so each variant of those tests has to run with them set.
  variables:
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1
    CODE_COVERAGE: "false"
  parallel:
    matrix:
      - TEST_PLATFORM: [editmode, playmode]
  script:
    - *install_yq
    - ./.scripts/ci/set_scripting_defines.sh "ELYMPICS_LAZY_WEBRTC_CONTEXT;ELYMPICS_DISABLE_USAGE_STATISTICS;ELYMPICS_DISABLE_BUILD_SCENE_VALIDATION;ELYMPICS_DISABLE_RUN_IN_BACKGROUND;ELYMPICS_DISABLE_PHYSICS2D_SCENE_CHECK"
    - ./.scripts/ci/test.sh

test:editmode:unity-versions:
  extends:
    - .test
    - .library_cache
  # Compiles and runs EditMode tests around the version cut-offs: 6.4 (hierarchy EntityId event) and 6.5 (Unity's own Unsafe).
  image: unityci/editor:ubuntu-$TEST_UNITY_VERSION-base-3
  needs:
    - job: detect-tested-release-merge
      optional: true
  timeout: 45m
  variables:
    TEST_PLATFORM: editmode
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1
    CODE_COVERAGE: "false"
  parallel:
    matrix:
      - TEST_UNITY_VERSION: ["6000.4.12f1", "6000.5.11f1"]
  cache:
    key:
      prefix: library-editmode-$TEST_UNITY_VERSION
  script:
    - *install_yq
    - ./.scripts/ci/create_testing_project.sh
    - ./.scripts/ci/test.sh

test:editmode:newest:
  extends: .test
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project:newest
  variables:
    UNITY_VERSION: $NEWEST_UNITY_VERSION
    TEST_PLATFORM: editmode
    TESTING_TYPE: JUNIT
    GIT_DEPTH: 1
    CODE_COVERAGE: "false"

create-coverage-report:
  extends:
    - .dotnet_image
  rules:
    - if: '$CI_COMMIT_BRANCH != "develop"'
      when: never
    - !reference [.cond.code.license, rules]
  stage: test
  needs:
    - job: test:playmode
    - job: test:editmode
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
  before_script:
    - dotnet tool install -g dotnet-reportgenerator-globaltool
  script:
    - mkdir ./converted_coverage
    - '"${HOME}/.dotnet/tools/reportgenerator" "-reports:./coverage/*/*/*.xml" "-targetdir:./converted_coverage" "-reporttypes:Cobertura;TextSummary;Html" "-verbosity:Verbose"'
    - sed -i 's@'"$PACKAGE_DIR"'/Samples@Samples~@' ./converted_coverage/Cobertura.xml
    - sed -i 's@'"$PACKAGE_DIR"'/@@' ./converted_coverage/Cobertura.xml
    - cat ./converted_coverage/Summary.txt
  artifacts:
    paths:
      - converted_coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: ./converted_coverage/Cobertura.xml
  coverage: "/Line coverage: (\\d+.\\d+)/"

verify-formatting:
  extends:
    - .unity_image
    - .cond.code.license
  stage: verify
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
  before_script:
    - *unity_code_before_script
    - *install_dotnet
    - apt-get install -y --no-install-recommends jq
  script:
    # Library/ comes from create-testing-project, so Unity resolves packages and writes the csprojs here.
    - ./.scripts/ci/generate_solution_files.sh
    - ./.scripts/ci/generate_formatting_report.sh
  artifacts:
    when: always
    paths:
      - format-report.codequality.json
    expire_in: 2 weeks
    reports:
      codequality: format-report.codequality.json

audit:project-auditor:
  extends:
    - .unity_image
    - .cond.code.license
  stage: verify
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
  before_script:
    - *unity_code_before_script
    - apt-get update && apt-get install -y --no-install-recommends jq
  script:
    - ./.scripts/ci/project_auditor.sh
  artifacts:
    when: always
    paths:
      - project-auditor-findings.txt
    expire_in: 2 weeks

verify-messagepack-generated:
  extends:
    - .unity_image
    - .cond.code.license
  stage: verify
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
    ORIGINAL_GENERATED_PATH: "${PACKAGE_DIR}/Runtime/Plugins/MessagePackGenerated.cs"
    CORRECT_GENERATED_PATH: "${CI_PROJECT_DIR}/MessagePackGenerated.cs"
  before_script:
    - *unity_code_before_script
    - *install_dotnet
    - dotnet tool install --global MessagePack.Generator --version $MESSAGEPACK_VERSION
  script:
    - ./.scripts/ci/generate_solution_files.sh
    - '"${HOME}/.dotnet/tools/mpc" -i "${UNITY_DIR}/Elympics.csproj" -o "$CORRECT_GENERATED_PATH"'
    - diff --strip-trailing-cr "$ORIGINAL_GENERATED_PATH" "$CORRECT_GENERATED_PATH"
  artifacts:
    when: always
    paths:
      - MessagePackGenerated.cs
    expire_in: 1 day

verify-compiled-protos:
  extends:
    - .unity_image
    - .cond.code.license
  stage: verify
  needs:
    - job: detect-tested-release-merge
      optional: true
    - job: create-testing-project
  variables:
    GIT_DEPTH: 1
    PROTO_SCHEMAS_DIR: "${PACKAGE_DIR}/Runtime/GameEngine/Libraries/Proto/Protos"
    ORIGINAL_COMPILED_PATH: ../ProtosCompiled
    CURRENT_COMPILED_PATH: ../ProtosCompiledCurrent
  cache: []
  before_script:
    - *skip_if_tested
    - apt-get update && apt-get install -y --no-install-recommends unzip
    - wget "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip" -O protoc.zip
    - unzip -o protoc.zip -d /usr/local
  script:
    - cd "$PROTO_SCHEMAS_DIR"
    - PROTOS_OUT_DIR="$CURRENT_COMPILED_PATH" ./.compile_protos.sh
    - diff -rx "*.meta" "$ORIGINAL_COMPILED_PATH" "$CURRENT_COMPILED_PATH"
  artifacts:
    when: always
    paths:
      - "$PROTO_SCHEMAS_DIR/$CURRENT_COMPILED_PATH"
    expire_in: 1 day

create-changelog:
  extends:
    - .node_image
    - .cond.releasebranch
  stage: pre-release
  needs:
    - job: get-package-version
    - job: get-branch-version
  variables:
    GIT_DEPTH: 0
  before_script:
    - npm install -g conventional-changelog-cli@2.2.2
    - git config user.email "bot@elympics.cc"
    - git config user.name "Elympics Bot"
    - git remote remove gitlab_origin || true
    - git remote add gitlab_origin https://oauth2:$GITLAB_ACCESS_TOKEN@$CI_SERVER_HOST/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
  script:
    - ./.scripts/ci/bump_version_and_generate_changelog.sh || exit 137
    - ./.scripts/ci/commit_changelog_and_version.sh
  allow_failure:
    exit_codes: 137

get-changelog-for-release:
  extends:
    - .node_image
    - .cond.release.always
  stage: pre-release
  # Test and verify jobs are absent on tags and in release-only pipelines.
  needs:
    - job: get-package-version
    - job: test:playmode
      artifacts: false
      optional: true
    - job: test:editmode
      artifacts: false
      optional: true
  variables:
    GIT_DEPTH: 1
  before_script:
    - npm install -g changelog-parser@3
    - export NODE_PATH="$(npm root -g)"
  script:
    - echo $PACKAGE_VERSION
    - node ./.scripts/ci/parse_changelog.js CHANGELOG.md $PACKAGE_VERSION > release.description
    - echo "Release notes to deploy:"
    - cat release.description
  artifacts:
    paths:
      - release.description

check-if-release-possible:
  extends:
    - .cond.release.auto
    - .ubuntu_image
  stage: pre-release
  needs:
    - job: get-package-version
    - job: test:playmode
      artifacts: false
      optional: true
    - job: test:editmode
      artifacts: false
      optional: true
    - job: verify-formatting
      artifacts: false
      optional: true
    - job: verify-messagepack-generated
      artifacts: false
      optional: true
    - job: compile:elympics-debug
      artifacts: false
      optional: true
    - job: verify-js
      artifacts: false
      optional: true
    - job: verify-compiled-protos
      artifacts: false
      optional: true
    - job: build:sample
      artifacts: false
      optional: true
    - job: test:playmode:no-domain-reload
      artifacts: false
      optional: true
    - job: test:disable-defines
      artifacts: false
      optional: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends git
  script:
    - ./.scripts/ci/ensure_tag_does_not_exist.sh $RELEASE_TAG_VERSION

release:gitlab:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends:
    - .cond.release.manual
  needs:
    - job: get-changelog-for-release
    - job: get-package-version
    - job: check-if-release-possible
      artifacts: false
  script:
    - echo "Releasing tag for version $RELEASE_TAG_VERSION"
  release:
    tag_name: $RELEASE_TAG_VERSION
    description: ./release.description

release:github:
  stage: release
  image: ghcr.io/supportpal/github-gh-cli:latest
  extends:
    - .cond.release.post
  needs:
    - job: get-changelog-for-release
  script:
    - gh release create "$CI_COMMIT_TAG" -t "$CI_COMMIT_TAG" -F ./release.description --repo "$GH_REPO" --verify-tag
